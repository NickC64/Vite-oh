[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vite-oh"
version = "1.0.0"
description = "A serverless anonymous-veto Discord bot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "google-cloud-firestore==2.34.1",
  "google-cloud-tasks==2.26.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "markdown-it-py==4.2.0",
  "pydantic-settings==2.16.2",
  "pynacl==1.6.2",
  "python-multipart==0.0.33",
  "tzdata==2026.6",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "playwright==1.64.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["viteoh"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["viteoh"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=viteoh --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
  "viteoh/cleanup_legacy.py",
  "viteoh/register_commands.py",
  "viteoh/repository.py",
]
