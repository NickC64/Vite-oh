version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      containers:
        patterns: ["*"]
    ignore:
      # Keep the image aligned with requires-python and CI until an intentional
      # interpreter upgrade. Security/patch updates within 3.13 remain enabled.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/application"]
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
