{% extends "base.html" %}
{% block content %}
<section class="page-heading"><div><span class="eyebrow">{{ guild_name }}</span><h1>Server settings</h1><p>Changes affect future proposals only.</p></div></section>
<form class="panel form-stack narrow" method="post" action="/app/settings">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <input type="hidden" name="guild_id" value="{{ guild_id }}">
  <section class="settings-section">
    <label>Proposal channel
      <select name="channel_id" required>
        {% for channel in output_channels %}
        <option value="{{ channel.id }}" {% if config and config.output_channel_id == channel.id %}selected{% endif %} {% if not channel.bot_ready %}disabled{% endif %}>#{{ channel.name }}{% if not channel.bot_ready %} — bot permissions missing{% endif %}</option>
        {% endfor %}
      </select>
      <small>The bot needs View Channel, Send Messages, Embed Links, and Read Message History.</small>
    </label>
  </section>
  <section class="settings-section">
    <fieldset class="duration-picker" data-duration-picker>
      <legend>Default voting duration</legend>
      <div class="duration-fields">
        <label>Days<input type="number" name="duration_days" min="0" max="7" required value="{{ duration_parts.days }}" inputmode="numeric"></label>
        <label>Hours<input type="number" name="duration_hours" min="0" max="23" required value="{{ duration_parts.hours }}" inputmode="numeric"></label>
        <label>Minutes<input type="number" name="duration_remainder_minutes" min="0" max="59" required value="{{ duration_parts.minutes }}" inputmode="numeric"></label>
      </div>
      <small>Between one minute and seven days. Existing proposal deadlines do not change. <strong data-duration-summary></strong></small>
    </fieldset>
  </section>
  <section class="settings-section">
    <label>Server timezone
      <input name="timezone" required list="timezone-options" value="{{ config.timezone if config and config.timezone_configured else '' }}" placeholder="America/Toronto" data-timezone-field data-unconfigured="{{ 'false' if config and config.timezone_configured else 'true' }}">
      <datalist id="timezone-options">{% for timezone in timezones %}<option value="{{ timezone }}">{% endfor %}</datalist>
      <small>Used when a browser cannot provide a useful timezone and when adding past decisions.</small>
    </label>
  </section>
  <div><button class="primary" type="submit">Save server settings</button></div>
</form>
{% endblock %}
